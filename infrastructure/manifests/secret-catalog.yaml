# InfinityRx Secret Catalog
#
# Authoritative list of secrets managed via Azure Key Vault in production.
# In development/mock these are loaded from environment variables with the
# same names.
#
# Key Vault naming convention: env-var name → lowercase, underscores → hyphens
#   JWT_SECRET → jwt-secret
#   ENCRYPTION_KEY_ACTIVE → encryption-key-active
#
# Vault naming pattern: infinityrx-{env}   (e.g. infinityrx-prod)
# Per-tenant override:  infinityrx-{env}-{tenant_slug}
#
# Sensitivity levels:
#   CRITICAL  — exposure causes PHI breach or financial fraud
#   HIGH      — exposure allows auth bypass or data access
#   MEDIUM    — exposure enables external API abuse / billing fraud
#   LOW       — informational, no direct attack surface

secrets:

  # ── Authentication ──────────────────────────────────────────────────────────
  - name: jwt-secret
    env_var: JWT_SECRET
    sensitivity: HIGH
    used_by:
      - shared/auth/_settings.py
      - shared/config.py (Settings.JWT_SECRET)
    description: >
      HMAC signing key for all JWT access and refresh tokens. Minimum 32
      characters. Rotation requires all active sessions to be invalidated
      or dual-validation during the rotation window.
    key_vault_path: "secrets/jwt-secret"
    rotation_period_days: 90

  # ── PHI Encryption ─────────────────────────────────────────────────────────
  - name: encryption-key-active
    env_var: ENCRYPTION_KEY_ACTIVE
    sensitivity: CRITICAL
    used_by:
      - shared/crypto/keys.py (EnvKeyProvider)
      - All PHI model columns via EncryptedString
    description: >
      AES-256 master encryption key for all PHI at rest. Base64-encoded
      32 bytes. Rotation requires re-encryption of all PHI columns — use
      the encryption-key-active-id / ENCRYPTION_KEY_{id} rotation pattern
      in shared/crypto/keys.py.
    key_vault_path: "secrets/encryption-key-active"
    rotation_period_days: 365

  - name: encryption-key-active-id
    env_var: ENCRYPTION_KEY_ACTIVE_ID
    sensitivity: LOW
    used_by:
      - shared/crypto/keys.py (EnvKeyProvider)
    description: >
      Identifier (e.g. "v1") for the active encryption key. Used to look
      up the correct rotation key during decryption. Not secret itself but
      stored in vault for consistency.
    key_vault_path: "secrets/encryption-key-active-id"
    rotation_period_days: 365

  # ── Database Connections ────────────────────────────────────────────────────
  - name: database-url
    env_var: DATABASE_URL
    sensitivity: HIGH
    used_by:
      - shared/config.py (Settings.DATABASE_URL)
      - shared/db/engine.py
    description: >
      Async SQLAlchemy connection URL for the operational database.
      Contains username, password, host, and database name.
      Format: postgresql+asyncpg://user:pass@host/db
    key_vault_path: "secrets/database-url"
    rotation_period_days: 180

  - name: database-url-sync
    env_var: DATABASE_URL_SYNC
    sensitivity: HIGH
    used_by:
      - shared/config.py (Settings.DATABASE_URL_SYNC)
      - modules/*/alembic/env.py
    description: >
      Sync SQLAlchemy connection URL (psycopg2). Used by Alembic migrations
      and seed scripts that cannot use asyncpg.
    key_vault_path: "secrets/database-url-sync"
    rotation_period_days: 180

  - name: billing-database-url
    env_var: BILLING_DATABASE_URL
    sensitivity: HIGH
    used_by:
      - modules/billing/src/db/session.py
    description: >
      Billing module database connection. May point at a separate DB or
      schema from the core operational DB depending on deployment topology.
    key_vault_path: "secrets/billing-database-url"
    rotation_period_days: 180

  - name: drug-db-database-url
    env_var: DRUG_DB_DATABASE_URL
    sensitivity: HIGH
    used_by:
      - modules/drug-database/src/db/session.py
    description: >
      Drug database module connection. Reads reference data (NDC, pricing,
      interactions) from the shared reference schema.
    key_vault_path: "secrets/drug-db-database-url"
    rotation_period_days: 180

  - name: plan-design-database-url
    env_var: PLAN_DESIGN_DATABASE_URL
    sensitivity: HIGH
    used_by:
      - modules/plan-design/src/db/session.py
    description: Plan design module database connection.
    key_vault_path: "secrets/plan-design-database-url"
    rotation_period_days: 180

  - name: rebate-database-url
    env_var: REBATE_DATABASE_URL
    sensitivity: HIGH
    used_by:
      - modules/rebate-management/src/db/session.py
    description: Rebate management module database connection.
    key_vault_path: "secrets/rebate-database-url"
    rotation_period_days: 180

  # ── Messaging / Cache ───────────────────────────────────────────────────────
  - name: redis-url
    env_var: REDIS_URL
    sensitivity: MEDIUM
    used_by:
      - shared/config.py (Settings.REDIS_URL)
      - modules/core-platform/src/auth/wiring.py
      - modules/core-platform/src/health/api.py
      - modules/dataiq/src/main.py
    description: >
      Redis connection URL. May include auth token (redis://:token@host/db).
      Used for session revocation, rate limiting, and caching.
    key_vault_path: "secrets/redis-url"
    rotation_period_days: 180

  - name: rabbitmq-url
    env_var: RABBITMQ_URL
    sensitivity: MEDIUM
    used_by:
      - shared/config.py (Settings.RABBITMQ_URL)
    description: >
      RabbitMQ AMQP connection URL including username and password.
      Format: amqp://user:pass@host:5672/vhost
    key_vault_path: "secrets/rabbitmq-url"
    rotation_period_days: 180

  # ── External APIs ───────────────────────────────────────────────────────────
  - name: azure-openai-api-key
    env_var: AZURE_OPENAI_API_KEY
    sensitivity: HIGH
    used_by:
      - shared/ai/openai_client.py (OpenAIConfig, env_prefix="AZURE_OPENAI_")
    description: >
      Azure OpenAI service API key. Billed per token; exposure enables
      financial fraud via unbounded API calls against this subscription.
    key_vault_path: "secrets/azure-openai-api-key"
    rotation_period_days: 90

  - name: azure-openai-endpoint
    env_var: AZURE_OPENAI_ENDPOINT
    sensitivity: MEDIUM
    used_by:
      - shared/ai/openai_client.py (OpenAIConfig, env_prefix="AZURE_OPENAI_")
    description: >
      Azure OpenAI service endpoint URL. Scoped to this subscription's
      resource; exposure enables enumeration of deployed models.
    key_vault_path: "secrets/azure-openai-endpoint"
    rotation_period_days: 365

  - name: sam-api-key
    env_var: SAM_API_KEY
    sensitivity: MEDIUM
    used_by:
      - shared/config.py (Settings.SAM_API_KEY)
      - modules/core-platform/src/_shim/config.py
      - modules/core-platform/src/exclusions/job_handler.py
    description: >
      SAM.gov API key for federal contractor exclusion screening.
      Empty string is permitted in development (disables SAM checks).
    key_vault_path: "secrets/sam-api-key"
    rotation_period_days: 365
    optional_in_dev: true
