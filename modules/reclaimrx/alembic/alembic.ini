# Alembic configuration for reclaimrx module.
# Manages schema: reclaimrx
#
# IMPORTANT: This file lives at modules/reclaimrx/alembic/alembic.ini — NOT at
# the module root (modules/reclaimrx/alembic.ini). This is intentional:
#   - infrastructure/scripts/run_migrations.sh checks for a module-root alembic.ini
#     and runs `alembic upgrade head`. reclaimrx has a two-head fork
#     (0008_ml_detector_seed vs 0008_sp3_extensions), so bare `upgrade head`
#     would fail. Placing the ini inside the alembic/ dir keeps the runner
#     skipping reclaimrx until the fork is merged (tracked tech-debt).
#
# Invoke explicitly:
#   python -m alembic -c modules/reclaimrx/alembic/alembic.ini <cmd>
# Always use a NAMED revision, never `head` (two-head fork).

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s
version_path_separator = os
version_locations = %(here)s/versions

# Override sqlalchemy.url from environment in env.py
sqlalchemy.url = postgresql+psycopg2://%(DB_USER)s:%(DB_PASSWORD)s@%(DB_HOST)s:%(DB_PORT)s/%(DB_NAME)s

[post_write_hooks]
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
