[project]
name = "infinityrx-platform"
version = "0.1.0"
description = "InfinityRx Enterprise PBM Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.2",
  "pyjwt>=2.10",
  "cryptography>=44.0",
  "aio-pika>=9.5",
  "redis>=5.2",
  "croniter>=5.0",
  "rapidfuzz>=3.10",
  "httpx>=0.28",
  "openpyxl>=3.1.5",
  "python-multipart>=0.0.19",
  "python-json-logger>=3.2",
  "email-validator>=2.2",
  "psycopg2-binary>=2.9.11",
  "xgboost>=3.2.0",
  "scikit-learn>=1.8.0",
  "networkx>=3.6.1",
  "pyotp>=2.9.0",
  "fido2>=2.1.1",
  "openai>=1.50",
  "jinja2>=3.1",
  "pgvector>=0.3",
  "numpy>=2.0",
]


[tool.uv]
package = false

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["modules/core-platform/tests", "shared/tests", "tests"]
# NOTE: billing / payment-processing / reclaimrx / reporting / ai-nlp
# tests are NOT in the default testpaths. The root conftest pins
# ``modules/core-platform/src`` to sys.path so ``src.*`` resolves for
# core-platform. Every other module uses the same top-level ``src``
# package name and would collide, and each has its own ``conftest.py``
# with a ``sys.path`` insert that conflicts with the others under
# ``--import-mode=importlib``. Each module is run separately:
#   uv run pytest modules/<name>/tests
# Unifying them needs a namespace-package rename (or per-module
# package names) — tracked as its own follow-up task.
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib -m 'not integration'"
markers = [
  "integration: marks tests that require a live Postgres/RabbitMQ/Redis instance",
]
filterwarnings = [
  "error",
  # Starlette's sync TestClient leaves sockets to be GC'd between tests,
  # which the asyncio debug hooks surface as ResourceWarning. These are
  # cosmetic and unrelated to the code under test.
  "ignore::ResourceWarning",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = [
  "shared/db",
  "shared/auth",
  "shared/events",
  "shared/utils",
  "shared/crypto",
  "shared/ai",
  "shared",
  "modules/core-platform/src",
  "modules/billing/src",
  "modules/reclaimrx/src",
  "modules/ai-nlp/src",
  "modules/member-management/src",
]
omit = [
  "**/__init__.py",
  "**/migrations/*",
  "**/alembic/*",
  "**/_shim/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E","F","W","I","UP","B","SIM","RUF"]
ignore = ["E501", "B008"]

[tool.bandit]
# Static security linter.  Only flags medium+ severity findings.
# Test directories excluded — test code legitimately uses assert,
# hardcoded credentials, and shell=True in fixtures.
skips = [
    "B101",  # assert_used — tests rely on assertions
]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist",
    "modules/core-platform/tests",
    "shared/tests",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres,redis,rabbitmq]>=4.9",
    "freezegun>=1.5",
    "respx>=0.22",
    "fakeredis>=2.26",
    "aiosqlite>=0.20",
    "hypothesis>=6.151.12",
]
