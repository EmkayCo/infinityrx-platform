[project]
name = "infinityrx-platform"
version = "0.1.0"
description = "InfinityRx Enterprise PBM Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.2",
  "pyjwt>=2.10",
  "cryptography>=44.0",
  "aio-pika>=9.5",
  "redis>=5.2",
  "croniter>=5.0",
  "rapidfuzz>=3.10",
  "httpx>=0.28",
  "openpyxl>=3.1.5",
  "python-multipart>=0.0.19",
  "python-json-logger>=3.2",
  "email-validator>=2.2",
  "psycopg2-binary>=2.9.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "testcontainers[postgres,redis,rabbitmq]>=4.9",
  "freezegun>=1.5",
  "respx>=0.22",
  "fakeredis>=2.26",
]

[tool.uv]
package = false

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "auto"
testpaths = ["modules/core-platform/tests", "shared/tests", "tests"]
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
markers = [
  "integration: marks tests that require a live Postgres instance",
]
filterwarnings = [
  "error",
  # Starlette's sync TestClient leaves sockets to be GC'd between tests,
  # which the asyncio debug hooks surface as ResourceWarning. These are
  # cosmetic and unrelated to the code under test.
  "ignore::ResourceWarning",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = [
  "shared/db",
  "shared/auth",
  "shared/events",
  "shared/utils",
  "shared/crypto",
  "shared",
  "modules/core-platform/src",
]
omit = [
  "**/__init__.py",
  "**/migrations/*",
  "**/alembic/*",
  "**/_shim/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E","F","W","I","UP","B","SIM","RUF"]
ignore = ["E501", "B008"]

[dependency-groups]
dev = [
    "hypothesis>=6.151.12",
]
