services:
  postgres:
    image: postgres:17
    container_name: infinityrx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infinityrx
      POSTGRES_PASSWORD: infinityrx_dev
      POSTGRES_DB: infinityrx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinityrx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: infinityrx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: infinityrx-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: infinityrx
      RABBITMQ_DEFAULT_PASS: infinityrx_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

# ---------------------------------------------------------------------------
# HIPAA §164.308(a)(7) contingency plan — scheduled backups
# ---------------------------------------------------------------------------
# The backup script lives at ./infrastructure/scripts/backup.sh. For local
# dev you can schedule it with a host cron entry:
#
#   crontab -e
#   0 2 * * *  cd /path/to/infinityrx-platform && \
#              PGPASSWORD=infinityrx_dev ./infrastructure/scripts/backup.sh \
#              >> var/backups/backup.log 2>&1
#
# In production (AKS) the equivalent is a CronJob manifest under
# infrastructure/k8s/ that mounts a PV at /var/backups and runs the same
# script. Run verify_backup.py weekly against the most-recent dump to prove
# restorability — a backup you've never restored is not a backup.
