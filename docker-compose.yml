services:
  postgres:
    image: postgres:17
    container_name: infinityrx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infinityrx
      POSTGRES_PASSWORD: infinityrx_dev
      POSTGRES_DB: infinityrx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinityrx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: infinityrx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: infinityrx-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: infinityrx
      RABBITMQ_DEFAULT_PASS: infinityrx_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
