services:
  postgres:
    image: postgres:17.5
    container_name: infinityrx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infinityrx
      # Bootstrap superuser password — the per-environment .env.{dev,mock,prod}
      # files set their own connection strings; this is just the Docker init
      # password used while the cluster boots and runs init-multi-db.sql.
      POSTGRES_PASSWORD: infinityrx_bootstrap
      # init-multi-db.sql creates infinityrx_{prod,dev,mock} explicitly,
      # so no POSTGRES_DB is needed.
    # log_min_duration_statement=1000 → any query running >1s is logged
    # with its text + parameters. Essential for catching N+1 queries,
    # missing indexes, and long-running audit exports before they
    # degrade tenant response times at 100M claims/yr scale.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "statement_timeout=30000"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_line_prefix=%t [%p]: db=%d,user=%u,app=%a,client=%h "
      - "-c"
      - "log_statement=ddl"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-multi-db.sql:/docker-entrypoint-initdb.d/01-init-multi-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinityrx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.3
    container_name: infinityrx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: infinityrx-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: infinityrx
      RABBITMQ_DEFAULT_PASS: infinityrx_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Reference-data loader (placeholder) ────────────────────────────────
  # The reference schemas (drug NDC, NPPES prescribers, NCPDP pharmacies,
  # CMS rates, FDA Orange Book, etc.) are populated by ETL scripts under
  # shared/data_ingestion/. They run on the host (not in a container) so
  # they can read source files from data/raw/. Wire a service here later
  # if/when the ETL is dockerized.
  #
  # Manual ETL invocation (run for each environment):
  #   source infrastructure/scripts/switch_env.sh dev
  #   uv run python shared/data_ingestion/scripts/load_fda_ndc.py
  #   uv run python shared/data_ingestion/scripts/load_ncpdp.py
  #   uv run python shared/data_ingestion/scripts/load_nppes.py
  #   ... (etc — see CLAUDE.md → Reference data)

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

# ---------------------------------------------------------------------------
# HIPAA §164.308(a)(7) contingency plan — scheduled backups
# ---------------------------------------------------------------------------
# The backup script lives at ./infrastructure/scripts/backup.sh. For local
# dev you can schedule it with a host cron entry:
#
#   crontab -e
#   0 2 * * *  cd /path/to/infinityrx-platform && \
#              PGPASSWORD=infinityrx_dev ./infrastructure/scripts/backup.sh \
#              >> var/backups/backup.log 2>&1
#
# In production (AKS) the equivalent is a CronJob manifest under
# infrastructure/k8s/ that mounts a PV at /var/backups and runs the same
# script. Run verify_backup.py weekly against the most-recent dump to prove
# restorability — a backup you've never restored is not a backup.
